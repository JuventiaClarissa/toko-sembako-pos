<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Preview Responsif - Toko Berkah Garam</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans antialiased min-h-screen flex flex-col">

  <!-- Top Controller Bar -->
  <header class="bg-slate-800/90 backdrop-blur-md border-b border-slate-700 px-6 py-3.5 flex flex-wrap items-center justify-between gap-4 sticky top-0 z-50">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-emerald-500 text-white flex items-center justify-center text-xl font-bold">
        <i class="fa-solid fa-store"></i>
      </div>
      <div>
        <h1 class="text-base font-extrabold text-white">Preview Responsif Multi-Device</h1>
        <p class="text-xs text-slate-400">Toko Berkah Garam • PWA & Web POS</p>
      </div>
    </div>

    <!-- Device Switcher Buttons -->
    <div class="flex items-center bg-slate-900 p-1.5 rounded-2xl border border-slate-700">
      <button onclick="setDevice('laptop')" id="btnLaptop" class="device-btn px-4 py-2 rounded-xl text-xs font-bold transition flex items-center gap-2 bg-emerald-600 text-white shadow-md">
        <i class="fa-solid fa-laptop text-sm"></i>
        <span>Laptop / PC</span>
      </button>

      <button onclick="setDevice('tablet')" id="btnTablet" class="device-btn px-4 py-2 rounded-xl text-xs font-bold text-slate-400 hover:text-white transition flex items-center gap-2">
        <i class="fa-solid fa-tablet-screen-button text-sm"></i>
        <span>Tablet (POS)</span>
      </button>

      <button onclick="setDevice('mobile')" id="btnMobile" class="device-btn px-4 py-2 rounded-xl text-xs font-bold text-slate-400 hover:text-white transition flex items-center gap-2">
        <i class="fa-solid fa-mobile-screen-button text-sm"></i>
        <span>Mobile (HP)</span>
      </button>
    </div>

    <!-- Quick Page Switcher -->
    <div class="flex items-center gap-2 text-xs">
      <span class="text-slate-400 font-semibold">Halaman:</span>
      <select id="pageSelect" onchange="changePage(this.value)" class="bg-slate-900 text-white border border-slate-700 rounded-xl px-3 py-2 text-xs font-bold focus:outline-none focus:ring-2 focus:ring-emerald-500">
        <option value="index.html">Beranda Utama</option>
        <option value="kasir.html">Kasir Penjualan</option>
        <option value="buku-bon.html">Buku Bon & Hutang</option>
        <option value="ambil-uang.html">Ambil Uang</option>
        <option value="stok.html">Stok Multi-Lokasi</option>
        <option value="stok-masuk.html">Stok Masuk (Kulakan)</option>
        <option value="buka-karung.html">Buka Karung Garam</option>
        <option value="tutup-kasir.html">Tutup Kasir Harian</option>
        <option value="laporan.html">Laporan & Backup</option>
        <option value="pengaturan.html">Pengaturan & Printer</option>
      </select>
    </div>
  </header>

  <!-- Interactive Device Viewport Frame -->
  <main class="flex-1 p-6 flex flex-col items-center justify-center overflow-auto">
    
    <!-- Info Banner -->
    <div id="deviceBadge" class="mb-4 text-xs font-bold text-slate-400 flex items-center gap-2 bg-slate-800/80 px-4 py-1.5 rounded-full border border-slate-700">
      <i class="fa-solid fa-laptop text-emerald-400"></i>
      <span>Mode Laptop: Layar penuh responsif (1200 x 750 px)</span>
    </div>

    <!-- Outer Frame Container -->
    <div id="frameContainer" class="w-full max-w-5xl h-[750px] bg-slate-950 rounded-3xl border-4 border-slate-700 shadow-2xl overflow-hidden transition-all duration-300 relative">
      <iframe 
        id="previewIframe" 
        src="index.html" 
        class="w-full h-full border-0 bg-white"
      ></iframe>
    </div>

  </main>

  <script>
    function setDevice(type) {
      document.querySelectorAll('.device-btn').forEach(b => {
        b.className = "device-btn px-4 py-2 rounded-xl text-xs font-bold text-slate-400 hover:text-white transition flex items-center gap-2";
      });

      const frame = document.getElementById('frameContainer');
      const badge = document.getElementById('deviceBadge');

      if (type === 'laptop') {
        document.getElementById('btnLaptop').className = "device-btn px-4 py-2 rounded-xl text-xs font-bold transition flex items-center gap-2 bg-emerald-600 text-white shadow-md";
        frame.className = "w-full max-w-5xl h-[750px] bg-slate-950 rounded-3xl border-4 border-slate-700 shadow-2xl overflow-hidden transition-all duration-300 relative";
        badge.innerHTML = '<i class="fa-solid fa-laptop text-emerald-400"></i><span>Mode Laptop: Layar penuh responsif (1024 x 750 px)</span>';
      } else if (type === 'tablet') {
        document.getElementById('btnTablet').className = "device-btn px-4 py-2 rounded-xl text-xs font-bold transition flex items-center gap-2 bg-blue-600 text-white shadow-md";
        frame.className = "w-[768px] h-[750px] bg-slate-950 rounded-[32px] border-8 border-slate-700 shadow-2xl overflow-hidden transition-all duration-300 relative";
        badge.innerHTML = '<i class="fa-solid fa-tablet-screen-button text-blue-400"></i><span>Mode Tablet POS: Kasir meja kasir (768 x 750 px)</span>';
      } else if (type === 'mobile') {
        document.getElementById('btnMobile').className = "device-btn px-4 py-2 rounded-xl text-xs font-bold transition flex items-center gap-2 bg-amber-600 text-white shadow-md";
        frame.className = "w-[390px] h-[750px] bg-slate-950 rounded-[44px] border-[10px] border-slate-800 shadow-2xl overflow-hidden transition-all duration-300 relative";
        badge.innerHTML = '<i class="fa-solid fa-mobile-screen-button text-amber-400"></i><span>Mode Smartphone: Layar sentuh HP orang tua (390 x 750 px)</span>';
      }
    }

    function changePage(page) {
      document.getElementById('previewIframe').src = page;
    }
  </script>
</body>
</html>
